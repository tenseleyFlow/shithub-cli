# golangci-lint v2 configuration for shithub-cli.
# Conservative ruleset — linters added as patterns earn them, not preemptively.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - bodyclose
    - gosec
    - revive
  settings:
    errcheck:
      exclude-functions:
        # CLI output to stderr/stdout: failure is irrelevant — if the user
        # closed the pipe we're going to terminate anyway. Wrapping every
        # Fprintf with `_, _ =` is noise.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Writer).Write
    staticcheck:
      # QF1008 ("embedded field selector could be removed") is a quickfix
      # suggestion only — the explicit form makes the source clearer at
      # test sites that mix tf.Factory.X (factory member) with tf.X
      # (testbench convenience). Disable.
      checks: ["all", "-QF1008"]
    revive:
      rules:
        # Disable the stutter sub-check of `exported`; package-qualified
        # names like config.ConfigDir read more clearly at call sites than
        # config.Dir, and renaming for one lint preference is not worth it.
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: var-naming
        - name: error-return
        - name: error-naming
        - name: if-return
        - name: receiver-naming
        - name: empty-block
    gosec:
      excludes:
        # Subprocess invocation via safeexec is intentional in internal/git;
        # we explicitly shell out to canonical git plumbing.
        - G204
        # The env-var names (SHITHUB_TOKEN, etc.) are public identifiers,
        # not embedded secrets; G101 fires on the substring "TOKEN".
        - G101
        # We intentionally persist HostEntry to YAML; the OAuthToken field
        # is the whole point of hosts.yml fallback storage.
        - G117
        # math/rand/v2 is intentional for retry jitter — we want speed and
        # decorrelation, not cryptographic randomness.
        - G404
    misspell:
      ignore-rules:
        # revive's import-naming rule; flagged as a typo of "imports".
        - importas
  exclusions:
    rules:
      # Tests routinely use error returns we don't check.
      - path: _test\.go
        linters: [errcheck, gosec]
      # mkResp in api/errors_test.go fabricates a *http.Response whose Body
      # is http.NoBody; there is nothing to close.
      - path: internal/api/errors_test\.go
        linters: [bodyclose]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tenseleyFlow/shithub-cli
    gofumpt:
      extra-rules: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
