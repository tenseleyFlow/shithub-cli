name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Install dev tools
        # We install gofumpt / goimports here so `make fmt-check` works.
        # golangci-lint comes from its dedicated action below.
        run: |
          go install mvdan.cc/gofumpt@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Run make ci
        # `lint` target inside make ci is a no-op duplicate of the
        # golangci-lint-action above on CI; locally it's the canonical entry.
        # We still run it to exercise the rest of the pipeline (fmt-check,
        # vet, spdx-check, test, build).
        run: |
          make fmt-check
          make vet
          make spdx-check
          make test
          make build

      - name: Verify binary
        run: ./bin/shithub --version
